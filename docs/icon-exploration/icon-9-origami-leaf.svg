<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="origami1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8ef7f"/>
    </linearGradient>
    <linearGradient id="origami2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#87cf3e"/>
    </linearGradient>
    <linearGradient id="origami3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d7c12"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="48" ry="48" fill="#202326"/>
  <rect x="6" y="6" width="244" height="244" rx="42" ry="42" fill="none" stroke="#2b2e33" stroke-width="2"/>

  <!-- Folha em origami geométrico (4 triângulos formando a folha) -->

  <!-- Triângulo superior esquerdo (claro) -->
  <polygon points="128,40 88,128 128,128" fill="url(#origami1)" stroke="#3d7c12" stroke-width="2" stroke-linejoin="round"/>

  <!-- Triângulo superior direito (médio) -->
  <polygon points="128,40 168,128 128,128" fill="url(#origami2)" stroke="#3d7c12" stroke-width="2" stroke-linejoin="round"/>

  <!-- Triângulo inferior esquerdo (escuro) -->
  <polygon points="88,128 128,128 128,216" fill="url(#origami2)" stroke="#3d7c12" stroke-width="2" stroke-linejoin="round"/>

  <!-- Triângulo inferior direito (mais escuro) -->
  <polygon points="168,128 128,128 128,216" fill="url(#origami3)" stroke="#3d7c12" stroke-width="2" stroke-linejoin="round"/>

  <!-- Veia central (linha de dobra) -->
  <line x1="128" y1="40" x2="128" y2="216" stroke="#3d7c12" stroke-width="3" opacity="0.8"/>

  <!-- Veias diagonais (outras dobras) -->
  <line x1="128" y1="40" x2="88" y2="128" stroke="#3d7c12" stroke-width="1.5" opacity="0.5"/>
  <line x1="128" y1="40" x2="168" y2="128" stroke="#3d7c12" stroke-width="1.5" opacity="0.5"/>
  <line x1="128" y1="128" x2="88" y2="128" stroke="#3d7c12" stroke-width="1.5" opacity="0.5"/>
  <line x1="128" y1="128" x2="168" y2="128" stroke="#3d7c12" stroke-width="1.5" opacity="0.5"/>

  <!-- Highlight superior -->
  <polygon points="128,40 88,128 128,128" fill="#ffffff" opacity="0.15"/>
</svg>