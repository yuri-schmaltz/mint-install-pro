<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="stampG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3c4149"/>
      <stop offset="100%" stop-color="#1f2124"/>
    </radialGradient>
    <linearGradient id="leaf10" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a3e85f"/>
      <stop offset="100%" stop-color="#5fa820"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="48" ry="48" fill="#202326"/>
  <rect x="6" y="6" width="244" height="244" rx="42" ry="42" fill="none" stroke="#2b2e33" stroke-width="2"/>

  <!-- Selo circular (3 círculos concêntricos) -->
  <circle cx="128" cy="128" r="92" fill="none" stroke="#87cf3e" stroke-width="2" opacity="0.4"/>
  <circle cx="128" cy="128" r="80" fill="url(#stampG)" stroke="#5fa820" stroke-width="3"/>
  <circle cx="128" cy="128" r="74" fill="none" stroke="#87cf3e" stroke-width="1" opacity="0.5"/>

  <!-- Texto curvado no topo (MINT) -->
  <defs>
    <path id="curveTop" d="M 58 128 A 70 70 0 0 1 198 128" fill="none"/>
  </defs>
  <text font-family="serif" font-size="14" fill="#87cf3e" font-weight="bold" letter-spacing="6">
    <textPath href="#curveTop" startOffset="50%" text-anchor="middle">★ MINT ★</textPath>
  </text>

  <!-- Texto curvado embaixo -->
  <defs>
    <path id="curveBot" d="M 64 144 A 64 64 0 0 0 192 144" fill="none"/>
  </defs>
  <text font-family="serif" font-size="10" fill="#5fa820" letter-spacing="3">
    <textPath href="#curveBot" startOffset="50%" text-anchor="middle">PRO 2026</textPath>
  </text>

  <!-- Folha central -->
  <g transform="translate(128,124)">
    <!-- Folha principal -->
    <path d="M0 -36 C 18 -28, 28 -8, 28 14 C 28 32, 14 42, 0 44 C -14 42, -28 32, -28 14 C -28 -8, -18 -28, 0 -36 Z"
          fill="url(#leaf10)" stroke="#3d7c12" stroke-width="2"/>
    <!-- Veia central -->
    <line x1="0" y1="-30" x2="0" y2="40" stroke="#3d7c12" stroke-width="2"/>
    <!-- Veias laterais -->
    <path d="M0 -10 Q -10 -2 -18 6" fill="none" stroke="#3d7c12" stroke-width="1.5" opacity="0.7"/>
    <path d="M0 -10 Q 10 -2 18 6" fill="none" stroke="#3d7c12" stroke-width="1.5" opacity="0.7"/>
    <path d="M0 14 Q -10 22 -16 30" fill="none" stroke="#3d7c12" stroke-width="1.5" opacity="0.7"/>
    <path d="M0 14 Q 10 22 16 30" fill="none" stroke="#3d7c12" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- Anos laterais pequenos -->
  <text x="128" y="200" font-family="serif" font-size="9" fill="#87cf3e" text-anchor="middle" opacity="0.7">★ ★ ★</text>

  <!-- Detalhes decorativos -->
  <circle cx="64" cy="128" r="3" fill="#87cf3e" opacity="0.6"/>
  <circle cx="192" cy="128" r="3" fill="#87cf3e" opacity="0.6"/>
</svg>