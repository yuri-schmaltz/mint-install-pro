<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Background -->
  <rect width="256" height="256" rx="48" ry="48" fill="#202326"/>
  <rect x="6" y="6" width="244" height="244" rx="42" ry="42" fill="none" stroke="#2b2e33" stroke-width="2"/>

  <!-- Janela terminal -->
  <rect x="32" y="48" width="192" height="160" rx="8" fill="#16181b" stroke="#3c4149" stroke-width="2"/>

  <!-- Title bar -->
  <rect x="32" y="48" width="192" height="24" rx="8" fill="#2b2e33"/>
  <rect x="32" y="66" width="192" height="6" fill="#2b2e33"/>

  <!-- 3 botões (close, min, max) -->
  <circle cx="48" cy="60" r="5" fill="#ff5f57"/>
  <circle cx="64" cy="60" r="5" fill="#febc2e"/>
  <circle cx="80" cy="60" r="5" fill="#28c840"/>

  <!-- Conteúdo do terminal -->
  <!-- Linha 1: prompt + apt install -->
  <text x="48" y="106" font-family="monospace" font-size="14" fill="#87cf3e" font-weight="bold">$</text>
  <text x="64" y="106" font-family="monospace" font-size="13" fill="#e0e0e0">apt install </text>
  <text x="142" y="106" font-family="monospace" font-size="13" fill="#87cf3e">mint</text>

  <!-- Linha 2: prompt + cursor -->
  <text x="48" y="134" font-family="monospace" font-size="14" fill="#87cf3e" font-weight="bold">$</text>
  <text x="64" y="134" font-family="monospace" font-size="13" fill="#e0e0e0">_</text>

  <!-- Linha 3: output -->
  <text x="48" y="162" font-family="monospace" font-size="11" fill="#9aa0a6">Reading package lists...</text>
  <text x="48" y="180" font-family="monospace" font-size="11" fill="#5fa820">[ OK ]</text>
  <text x="92" y="180" font-family="monospace" font-size="11" fill="#e0e0e0">installing 12 packages</text>

  <!-- Cursor blink (estático, posição final) -->
  <rect x="58" y="126" width="9" height="12" fill="#87cf3e" opacity="0.9"/>
</svg>