<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="traceG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a3e85f"/>
      <stop offset="100%" stop-color="#5fa820"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="48" ry="48" fill="#202326"/>
  <rect x="6" y="6" width="244" height="244" rx="42" ry="42" fill="none" stroke="#2b2e33" stroke-width="2"/>

  <!-- PCB traces seguindo contorno de folha -->
  <g stroke="url(#traceG)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Trace esquerda -->
    <path d="M48 200 L48 156 L72 132 L72 88"/>
    <!-- Trace direita -->
    <path d="M208 200 L208 156 L184 132 L184 88"/>
    <!-- Trace inferior esquerda -->
    <path d="M48 200 L88 200 L88 168"/>
    <!-- Trace inferior direita -->
    <path d="M208 200 L168 200 L168 168"/>
    <!-- Trace superior esquerda -->
    <path d="M72 88 L96 88 L96 124"/>
    <!-- Trace superior direita -->
    <path d="M184 88 L160 88 L160 124"/>
  </g>

  <!-- Pads de conexão -->
  <circle cx="48" cy="200" r="5" fill="#87cf3e"/>
  <circle cx="208" cy="200" r="5" fill="#87cf3e"/>
  <circle cx="72" cy="88" r="5" fill="#87cf3e"/>
  <circle cx="184" cy="88" r="5" fill="#87cf3e"/>
  <circle cx="88" cy="168" r="4" fill="#a3e85f"/>
  <circle cx="168" cy="168" r="4" fill="#a3e85f"/>
  <circle cx="96" cy="124" r="4" fill="#a3e85f"/>
  <circle cx="160" cy="124" r="4" fill="#a3e85f"/>

  <!-- Folha central -->
  <path d="M128 60
           C 168 80, 188 120, 188 150
           C 188 175, 160 190, 128 195
           C 96 190, 68 175, 68 150
           C 68 120, 88 80, 128 60 Z"
        fill="url(#traceG)" opacity="0.95" stroke="#3d7c12" stroke-width="2"/>

  <!-- Veia central da folha -->
  <line x1="128" y1="68" x2="128" y2="190" stroke="#3d7c12" stroke-width="2.5"/>

  <!-- Chip central -->
  <rect x="108" y="120" width="40" height="40" rx="3" fill="#16181b" stroke="#a3e85f" stroke-width="2"/>
  <text x="128" y="146" font-family="monospace" font-size="11" fill="#a3e85f" font-weight="bold" text-anchor="middle">MIP</text>

  <!-- Pinos do chip -->
  <line x1="108" y1="128" x2="100" y2="128" stroke="#a3e85f" stroke-width="2"/>
  <line x1="108" y1="140" x2="100" y2="140" stroke="#a3e85f" stroke-width="2"/>
  <line x1="108" y1="152" x2="100" y2="152" stroke="#a3e85f" stroke-width="2"/>
  <line x1="148" y1="128" x2="156" y2="128" stroke="#a3e85f" stroke-width="2"/>
  <line x1="148" y1="140" x2="156" y2="140" stroke="#a3e85f" stroke-width="2"/>
  <line x1="148" y1="152" x2="156" y2="152" stroke="#a3e85f" stroke-width="2"/>
</svg>