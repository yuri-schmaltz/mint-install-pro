<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="shieldG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3c4149"/>
      <stop offset="100%" stop-color="#1f2124"/>
    </linearGradient>
    <linearGradient id="checkG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a3e85f"/>
      <stop offset="100%" stop-color="#5fa820"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="48" ry="48" fill="#202326"/>
  <rect x="6" y="6" width="244" height="244" rx="42" ry="42" fill="none" stroke="#2b2e33" stroke-width="2"/>

  <!-- Escudo (sombra) -->
  <path d="M128 36 L208 64 L208 132 C 208 176, 174 208, 128 224 C 82 208, 48 176, 48 132 L 48 64 Z"
        fill="#000" opacity="0.3" transform="translate(4,4)"/>

  <!-- Escudo principal -->
  <path d="M128 32 L208 60 L208 128 C 208 172, 174 204, 128 220 C 82 204, 48 172, 48 128 L 48 60 Z"
        fill="url(#shieldG)" stroke="#5fa820" stroke-width="4"/>

  <!-- Highlight superior -->
  <path d="M128 40 L200 64 L128 80 L56 64 Z" fill="#ffffff" opacity="0.05"/>

  <!-- Checkmark no centro -->
  <path d="M88 124 L114 150 L168 96"
        fill="none" stroke="url(#checkG)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Folha pequena no canto inferior direito -->
  <g transform="translate(150,160) rotate(-25)">
    <path d="M0 0 Q12 -8 24 0 Q12 16 0 0 Z" fill="url(#checkG)" stroke="#3d7c12" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="24" y2="0" stroke="#3d7c12" stroke-width="1.5"/>
  </g>

  <!-- "MIP" ou ano pequeno no topo do escudo -->
  <text x="128" y="56" font-family="sans-serif" font-size="9" fill="#87cf3e" text-anchor="middle" font-weight="bold" letter-spacing="2">MIP 2026</text>
</svg>