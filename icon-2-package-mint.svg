<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="pkgBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b2e33"/>
      <stop offset="100%" stop-color="#1f2124"/>
    </linearGradient>
    <linearGradient id="leafTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a3e85f"/>
      <stop offset="100%" stop-color="#5fa820"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="48" ry="48" fill="#202326"/>
  <rect x="6" y="6" width="244" height="244" rx="42" ry="42" fill="none" stroke="#2b2e33" stroke-width="2"/>

  <!-- Caixa isométrica (3 faces) -->
  <!-- Top face -->
  <path d="M128 56 L216 100 L128 144 L40 100 Z" fill="url(#pkgBg)" stroke="#5fa820" stroke-width="2.5"/>
  <!-- Left face -->
  <path d="M40 100 L128 144 L128 220 L40 176 Z" fill="#26292d" stroke="#5fa820" stroke-width="2.5"/>
  <!-- Right face -->
  <path d="M216 100 L128 144 L128 220 L216 176 Z" fill="#1f2124" stroke="#5fa820" stroke-width="2.5"/>

  <!-- Fita verde cruzando a caixa (laço) -->
  <path d="M40 100 L216 100" stroke="#5fa820" stroke-width="6" opacity="0.6"/>
  <path d="M128 56 L128 144" stroke="#5fa820" stroke-width="6" opacity="0.6"/>

  <!-- Folha brotando do topo -->
  <path d="M128 30 Q156 50 128 70 Q100 50 128 30 Z" fill="url(#leafTop)" stroke="#3d7c12" stroke-width="2"/>
  <line x1="128" y1="30" x2="128" y2="56" stroke="#3d7c12" stroke-width="2"/>
  <path d="M128 38 Q142 44 142 52" fill="none" stroke="#3d7c12" stroke-width="1.5" opacity="0.7"/>

  <!-- Highlight no canto da caixa -->
  <path d="M128 56 L216 100 L208 104 L120 60 Z" fill="#ffffff" opacity="0.05"/>
</svg>