<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="leaf4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a3e85f"/>
      <stop offset="100%" stop-color="#5fa820"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="48" ry="48" fill="#202326"/>
  <rect x="6" y="6" width="244" height="244" rx="42" ry="42" fill="none" stroke="#2b2e33" stroke-width="2"/>

  <!-- Estante com 3 caixas de apps (linha de fundo) -->
  <!-- Caixa 1 -->
  <rect x="36" y="120" width="56" height="80" rx="6" fill="#2b2e33" stroke="#3c4149" stroke-width="2"/>
  <rect x="46" y="130" width="36" height="36" rx="3" fill="#5fa820" opacity="0.8"/>
  <line x1="48" y1="180" x2="80" y2="180" stroke="#5f6570" stroke-width="2"/>
  <line x1="48" y1="190" x2="72" y2="190" stroke="#5f6570" stroke-width="2"/>

  <!-- Caixa 2 -->
  <rect x="100" y="120" width="56" height="80" rx="6" fill="#2b2e33" stroke="#3c4149" stroke-width="2"/>
  <rect x="110" y="130" width="36" height="36" rx="3" fill="#87cf3e"/>
  <line x1="112" y1="180" x2="144" y2="180" stroke="#5f6570" stroke-width="2"/>
  <line x1="112" y1="190" x2="136" y2="190" stroke="#5f6570" stroke-width="2"/>

  <!-- Caixa 3 -->
  <rect x="164" y="120" width="56" height="80" rx="6" fill="#2b2e33" stroke="#3c4149" stroke-width="2"/>
  <rect x="174" y="130" width="36" height="36" rx="3" fill="#5fa820" opacity="0.8"/>
  <line x1="176" y1="180" x2="208" y2="180" stroke="#5f6570" stroke-width="2"/>
  <line x1="176" y1="190" x2="200" y2="190" stroke="#5f6570" stroke-width="2"/>

  <!-- Prateleira (linha embaixo) -->
  <rect x="28" y="200" width="200" height="6" rx="2" fill="#3c4149"/>

  <!-- Lupa sobreposta -->
  <circle cx="148" cy="78" r="36" fill="none" stroke="url(#leaf4)" stroke-width="8"/>
  <circle cx="148" cy="78" r="30" fill="#202326" opacity="0.6"/>
  <line x1="174" y1="106" x2="200" y2="132" stroke="url(#leaf4)" stroke-width="10" stroke-linecap="round"/>

  <!-- Folha dentro da lupa -->
  <path d="M148 60 Q160 70 148 82 Q136 70 148 60 Z" fill="url(#leaf4)"/>
  <line x1="148" y1="60" x2="148" y2="82" stroke="#3d7c12" stroke-width="1.5"/>
</svg>