[package]
name = "mintinstall_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
gtk4 = "0.8"
glib = "0.19"
gio = "0.19"
webkit6 = "0.3"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["fs"] }

[lib]
name = "mintinstall_rust"
path = "src/lib.rs"
