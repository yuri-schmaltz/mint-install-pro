<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="leafDown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a3e85f"/>
      <stop offset="100%" stop-color="#5fa820"/>
    </linearGradient>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b2e33"/>
      <stop offset="100%" stop-color="#1a1c1e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="48" ry="48" fill="url(#bg3)"/>
  <rect x="6" y="6" width="244" height="244" rx="42" ry="42" fill="none" stroke="#2b2e33" stroke-width="2"/>

  <!-- Folha apontando para baixo (instalar = baixar) -->
  <!-- Corpo principal da folha -->
  <path d="M128 40
           C 168 60, 188 100, 188 140
           C 188 175, 160 200, 128 210
           C 96 200, 68 175, 68 140
           C 68 100, 88 60, 128 40 Z"
        fill="url(#leafDown)" stroke="#3d7c12" stroke-width="3"/>

  <!-- Veia central -->
  <line x1="128" y1="50" x2="128" y2="200" stroke="#3d7c12" stroke-width="3"/>

  <!-- Veias laterais -->
  <path d="M128 90 Q108 100 92 116" fill="none" stroke="#3d7c12" stroke-width="2" opacity="0.6"/>
  <path d="M128 90 Q148 100 164 116" fill="none" stroke="#3d7c12" stroke-width="2" opacity="0.6"/>
  <path d="M128 130 Q100 140 80 158" fill="none" stroke="#3d7c12" stroke-width="2" opacity="0.6"/>
  <path d="M128 130 Q156 140 176 158" fill="none" stroke="#3d7c12" stroke-width="2" opacity="0.6"/>

  <!-- 2 prateleiras embaixo (suggestion of "disco/storage") -->
  <rect x="56" y="222" width="144" height="8" rx="2" fill="#5fa820" opacity="0.7"/>
  <rect x="72" y="236" width="112" height="6" rx="2" fill="#5fa820" opacity="0.5"/>

  <!-- Highlight superior -->
  <path d="M128 50 Q108 80 92 110" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
</svg>