<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Background com cantos arredondados -->
  <rect width="256" height="256" rx="48" ry="48" fill="#202326"/>
  <rect x="6" y="6" width="244" height="244" rx="42" ry="42" fill="none" stroke="#2b2e33" stroke-width="2"/>

  <!-- Folha mint estilizada como vértice do M -->
  <defs>
    <linearGradient id="leafM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a3e85f"/>
      <stop offset="100%" stop-color="#5fa820"/>
    </linearGradient>
  </defs>

  <!-- M estilizado: duas pernas + folha no centro -->
  <path d="M52 196 L52 76 L100 124 L100 76 L156 124 L156 76 L204 124 L204 196 L180 196 L180 124 L156 152 L156 196 L100 196 L100 152 L76 124 L76 196 Z"
        fill="url(#leafM)" stroke="#3d7c12" stroke-width="3" stroke-linejoin="round"/>

  <!-- Detalhe da folha no centro do M -->
  <path d="M120 100 Q128 92 136 100 Q128 116 120 100 Z" fill="#202326" opacity="0.4"/>
  <line x1="128" y1="92" x2="128" y2="108" stroke="#3d7c12" stroke-width="2"/>

  <!-- Pinos de chip embaixo -->
  <rect x="64" y="210" width="8" height="14" fill="#5fa820"/>
  <rect x="84" y="210" width="8" height="14" fill="#5fa820"/>
  <rect x="104" y="210" width="8" height="14" fill="#5fa820"/>
  <rect x="144" y="210" width="8" height="14" fill="#5fa820"/>
  <rect x="164" y="210" width="8" height="14" fill="#5fa820"/>
  <rect x="184" y="210" width="8" height="14" fill="#5fa820"/>
</svg>